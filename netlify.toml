[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://rthxlprgtfuhntpcdhsh.supabase.co/functions/v1/api"

[[redirects]]
  from = "/api/*"
  to = "https://rthxlprgtfuhntpcdhsh.supabase.co/functions/v1/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://rthxlprgtfuhntpcdhsh.supabase.co wss://rthxlprgtfuhntpcdhsh.supabase.co https://cdn.jsdelivr.net https://latest.currency-api.pages.dev; img-src 'self' data: blob: https://rthxlprgtfuhntpcdhsh.supabase.co; frame-src 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
